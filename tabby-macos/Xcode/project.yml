# XcodeGen spec for the TabbyMac app bundle. Lives in its own folder so the generated
# project isn't in the Swift package's root.
#   cd Xcode && xcodegen generate && open TabbyMac.xcodeproj   (or ../scripts/bootstrap-mac.sh)
# The generated TabbyMac.xcodeproj is not committed.
name: TabbyMac
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Ad-hoc signing for local builds; set a team for distribution.
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES
packages:
  TabbyMacPackage:
    path: ..
targets:
  TabbyMac:
    type: application
    platform: macOS
    sources:
      - path: ../App
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Assets.xcassets"
      # The app icon (Tabby's, from ../build/icons). Listed separately so XcodeGen treats
      # the catalog as a resource rather than a source folder.
      - path: ../App/Assets.xcassets
    dependencies:
      - package: TabbyMacPackage
        product: TabbyApp
      - target: tabby-askpass
        embed: true
        link: false
        copy:
          destination: executables
      - target: tabby
        embed: true
        link: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: TabbyMac
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tabbymac
        INFOPLIST_FILE: ../App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../App/TabbyMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    # libssh (the SSH library backend) and its libcrypto go into Contents/Frameworks.
    postBuildScripts:
      - name: Bundle libssh
        script: "\"$SRCROOT/../scripts/bundle-libssh.sh\""
        basedOnDependencyAnalysis: false
  # The SSH_ASKPASS helper, compiled from the package sources and copied to
  # TabbyMac.app/Contents/MacOS/tabby-askpass.
  tabby-askpass:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/TabbyAskpass
      - path: ../Sources/TabbyIPC
    settings:
      base:
        PRODUCT_NAME: tabby-askpass
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ASKPASS_STANDALONE"
        SKIP_INSTALL: YES
  # The command-line helper (phase 5), compiled from the package sources and copied to
  # TabbyMac.app/Contents/MacOS/tabby.
  tabby:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/TabbyCLI
      - path: ../Sources/TabbyCLIKit
    settings:
      base:
        PRODUCT_NAME: tabby
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TABBY_CLI_STANDALONE"
        SKIP_INSTALL: YES
schemes:
  TabbyMac:
    build:
      targets:
        TabbyMac: all
        tabby-askpass: all
        tabby: all
    run:
      config: Debug
    test:
      config: Debug
